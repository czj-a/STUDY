name: nature-paper-trans
description: Translate an English paper into a Chinese PDF with selectable text for highlighting and annotation by default.
always_load:
  - SKILL.md
references:
  on_demand:
    - condition: the user explicitly requests image-only output and source image paths are supported
      path: references/image-workflow.md
    - condition: before a page-generation request
      path: references/image-translation-prompt.md
scripts:
  on_demand:
    - condition: translate or assemble pages locally, including after image path errors
      path: scripts/local_pdf.py
    - condition: prepare image inputs, track generation, or assemble image-only results
      path: scripts/pages.py
